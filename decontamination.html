<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decontamination</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="sidebar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="add-equipment.html">Add new equipment</a></li>
            <li><a href="decontamination.html">Start decontamination</a></li>
            <li><a href="#" onclick="extractReports(); return false;">Extract reports</a></li>
            <li class="submenu">
                <a href="#">Patch</a>
                <ul>
                    <li><a href="#">Patch 000001</a></li>
                    <li><a href="#">Patch 000002</a></li>
                    <li><a href="#">Patch 000003</a></li>
                    <li><a href="#">Patch 000004</a></li>
                    <li><a href="#">Patch 000005</a></li>
                </ul>
            </li>
        </ul>
    </nav>
    <div class="main-content">
        <div id="decontaminationPage" class="page active">
            <h2>Start As New Patch</h2>
            <div class="header">
                <span>Patch number: <span id="patchNumber">0000</span></span>
                <label for="employeeName">Employee name:</label>
                <input type="text" id="employeeName" placeholder="Enter your name">
                <span id="currentDateTime"></span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Serial number</th>
                        <th>Type</th>
                        <th>Clinic</th>
                        <th>State</th>
                    </tr>
                </thead>
                <tbody id="decontaminationTableBody">
                    <!-- Scanned equipment rows will be added here -->
                </tbody>
            </table>
            <div class="buttons">
                <button onclick="window.location.href='index.html'" class="btn">Back</button>
                <button onclick="scanEquipment()" class="btn">Scan</button>
                <button onclick="createPatch()" class="btn">Go</button>
            </div>
        </div>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
